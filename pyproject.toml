[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-readiness-scaffold"
version = "0.1.0"
description = "Offline model/API evaluation and deployment-readiness scaffold for QA-to-MLOps portfolio work"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mlops-readiness = "mlops_readiness.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
